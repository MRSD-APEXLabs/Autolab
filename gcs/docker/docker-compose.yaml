services:
  gcs:
    profiles:
      - ""
      - sitl
      - simple
    extends:
      file: ./gcs-base-docker-compose.yaml
      service: gcs-base
    networks:
      - autolab_network
    ports:
      - 2222:22 # for ssh

  # ===================================================================================================================
  # for running on a real world laptop on the local network, set network mode to host
  gcs-real:
    profiles:
      - hitl
      - deploy
    extends:
      file: ./gcs-base-docker-compose.yaml
      service: gcs-base
    network_mode: host
    volumes:
      - $HOME/bags/:/bags
      - ../../robot/ros_ws/src/robot_bringup/rviz/:/bags/rviz
      - ../../plot:/plot
  # ===========================================================================
  # Monitoring stack (simulation/dev profile only)
  # gcs-real uses network_mode: host, so monitoring is scoped to gcs profile
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.11.0}
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=elastic-ros-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - autolab_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.11.0}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - autolab_network
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.11.0}
    container_name: filebeat
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    networks:
      - autolab_network
    command: filebeat -e --strict.perms=false
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started

volumes:
  elasticsearch-data:
    driver: local
