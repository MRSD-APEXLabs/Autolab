---
# docker compose file
services:
  gcs-base:
    build:
      context: ../
      dockerfile: docker/Dockerfile.gcs
      tags:
        - ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${DOCKER_IMAGE_TAG}_gcs
    command: >
      bash -c "service ssh restart; service mosquitto start;
      if [ $$AUTOLAUNCH = 'true' ]; then
        tmux new -d -s gcs_bringup;
        tmux send-keys -t gcs_bringup 'bws && sws; ros2 launch ${GCS_LAUNCH_PACKAGE} ${GCS_LAUNCH_FILE}' ENTER;
      fi;
      sleep infinity"
    # Interactive shell
    deploy:
      # let it use the GPU
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: 1
              driver: nvidia
    runtime: nvidia
    entrypoint: ''
    environment:
      - AUTOLAUNCH=${AUTOLAUNCH:-false}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=1
    image: ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${DOCKER_IMAGE_TAG}_gcs
    # Needed to display graphical applications
    # ipc: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      # display stuff
      - $HOME/.Xauthority:/home/gcs/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      # developer stuff
      - ../../common/.bash_profile:/home/gcs/.bash_profile:rw
      - .bashrc:/home/gcs/.bashrc:rw
      - ../../common/.tmux.conf:/home/gcs/.tmux.conf:rw
      - ../../common/inputrc:/etc/inputrc:rw
      - ../../.devcontainer/gcs/launch.json:/home/gcs/AutoLab/.vscode/launch.json:rw
      - ../../.devcontainer/gcs/tasks.json:/home/gcs/AutoLab/.vscode/tasks.json:rw
      # autonomy stack stuff
      - ../..:/home/gcs/AutoLab
      - ../../common/ros_packages:/home/gcs/AutoLab/gcs/ros_ws/src/common:rw # common ROS packages
      - ../../common/ros_packages/fastdds.xml:/home/gcs/AutoLab/gcs/ros_ws/fastdds.xml:rw # fastdds.xml
      # monitoring stack stuff
      - ./monitoring/mosquitto/mosquitto.conf:/etc/mosquitto/conf.d/autolab.conf:ro
