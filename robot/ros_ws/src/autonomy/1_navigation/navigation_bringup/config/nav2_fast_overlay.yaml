# nav_speed:=fast, loaded after the motion-mode overlay. Transit only: 1.2 m/s and a 1.2 m/s^2
# ramp (the bridge's accel cap). DockPath, StagePath, withdrawal, module steering profiles and
# rotation keep their normal settings. Chassis yaw stays inside the bridge's 1.5 rad/s cap.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 1.20
      wz_max: 1.50
      rotate_to_heading_angular_vel: 1.40

velocity_smoother:
  ros__parameters:
    max_velocity: [1.20, 0.18, 1.50]
    min_velocity: [-0.40, -0.18, -1.50]
    max_accel: [1.2, 0.5, 1.0]

behavior_server:
  ros__parameters:
    max_rotational_vel: 1.20

local_costmap:
  local_costmap:
    ros__parameters:
      # 2.8 s * 1.27 m/s (1.2 forward + 0.4 strafe) plus the padded footprint fits within a 9 m window.
      width: 9
      height: 9

collision_monitor:
  ros__parameters:
    PolygonSlow:
      # Keep the proven docking zone at low speed, extending it only above
      # normal transit speed. Sub-polygons are matched in this order.
      type: "velocity_polygon"
      holonomic: true
      velocity_polygons: ["fast_transit", "normal"]
      fast_transit:
        points: "[[0.94, 0.94], [0.94, -0.94], [-0.94, -0.94], [-0.94, 0.94]]"
        linear_min: 0.45
        linear_max: 1.3
        theta_min: -1.5
        theta_max: 1.5
        direction_start_angle: -3.141592653589793
        direction_end_angle: 3.141592653589793
      normal:
        points: "[[0.69, 0.69], [0.69, -0.69], [-0.69, -0.69], [-0.69, 0.69]]"
        linear_min: 0.0
        linear_max: 1.3
        theta_min: -1.5
        theta_max: 1.5
        direction_start_angle: -3.141592653589793
        direction_end_angle: 3.141592653589793
