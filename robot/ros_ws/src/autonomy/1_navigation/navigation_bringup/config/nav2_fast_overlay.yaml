# nav_speed:=fast, loaded after the motion-mode overlay. Transit only:
# DockPath, withdrawal, module steering profiles and acceleration ramps retain
# their normal settings. Chassis yaw stays inside the bridge's 1.5 rad/s cap.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.90
      wz_max: 1.50
      rotate_to_heading_angular_vel: 1.40

velocity_smoother:
  ros__parameters:
    max_velocity: [0.90, 0.06, 1.50]
    min_velocity: [-0.10, -0.06, -1.50]

behavior_server:
  ros__parameters:
    max_rotational_vel: 1.20

local_costmap:
  local_costmap:
    ros__parameters:
      # 2.8 s * 0.9 m/s plus the padded footprint fits within a 7 m window.
      width: 7
      height: 7

collision_monitor:
  ros__parameters:
    PolygonSlow:
      # Keep the proven docking zone at low speed, extending it only above
      # normal transit speed. Sub-polygons are matched in this order.
      type: "velocity_polygon"
      holonomic: true
      velocity_polygons: ["fast_transit", "normal"]
      fast_transit:
        points: "[[0.94, 0.94], [0.94, -0.94], [-0.94, -0.94], [-0.94, 0.94]]"
        linear_min: 0.45
        linear_max: 1.0
        theta_min: -1.5
        theta_max: 1.5
        direction_start_angle: -3.141592653589793
        direction_end_angle: 3.141592653589793
      normal:
        points: "[[0.69, 0.69], [0.69, -0.69], [-0.69, -0.69], [-0.69, 0.69]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -1.5
        theta_max: 1.5
        direction_start_angle: -3.141592653589793
        direction_end_angle: 3.141592653589793
