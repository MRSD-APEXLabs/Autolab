# nav_motion:=omni -- loaded AFTER nav2_params.yaml; only the parameters below change (arrays are replaced whole).
#
# Lets MPPI strafe with the swerve base instead of behaving like a diff-drive.
# WARNING: vy_max is symmetric (Jazzy MPPI has no vy_min), so the robot may also strafe to its RIGHT, into the sector
# the lidar cannot see (robot body, ~136 deg behind / right). Heading-to-path and forward-only penalties are
# disabled so position corrections use strafing instead of chassis turns. Use omni only in
# space that was mapped completely and is free of moving obstacles on the robot's right / rear.

controller_server:
  ros__parameters:
    FollowPath:
      # Holonomic travel does not need a turn-before-driving shim.
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      vy_max: 0.20
      # Ordinary pose goals consider their requested heading during the approach.
      # Named station transit keeps the starting heading; the station coordinator
      # aligns to the parked heading separately in the checked open staging area.
      GoalAngleCritic:
        enabled: true
        cost_weight: 6.0
        threshold_to_consider: 1.5     # [m] approach_distance
      PathAngleCritic:
        enabled: false
        threshold_to_consider: 1.5
      PreferForwardCritic:
        enabled: false
        threshold_to_consider: 1.5
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      TwirlingCritic:                  # holonomic only: damps needless rotation while translating
        enabled: true
        cost_power: 1                  # NOT "twirling_cost_power" (the stock yaml comment uses names the code ignores)
        cost_weight: 8.0               # preserve chassis heading during lateral position corrections

velocity_smoother:
  ros__parameters:
    # Allow transit strafing beyond the base configuration's small docking limit.
    max_velocity: [0.45, 0.20, 1.0]
    min_velocity: [-0.10, -0.20, -1.0]
    max_accel: [0.6, 0.6, 1.0]
    max_decel: [-1.5, -1.5, -3.0]
