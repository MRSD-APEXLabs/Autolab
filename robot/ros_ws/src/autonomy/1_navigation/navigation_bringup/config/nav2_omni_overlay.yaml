# nav_motion:=omni -- loaded AFTER nav2_params.yaml; only the parameters below change (arrays are replaced whole).
#
# Lets MPPI strafe with the swerve base instead of behaving like a diff-drive.
# WARNING: vy_max is symmetric (Jazzy MPPI has no vy_min), so the robot may also strafe to its RIGHT, into the sector
# the lidar cannot see (robot body, ~136 deg behind / right). PathAngleCritic is kept on purpose: it penalises
# travelling more than max_angle_to_furthest (1.0 rad = 57 deg) off the robot's heading, which BIASES (does not
# guarantee) the direction of travel to stay inside the lidar's field of view (-62 .. +154 deg). Use omni only in
# space that was mapped completely and is free of moving obstacles on the robot's right / rear.

controller_server:
  ros__parameters:
    FollowPath:
      # Holonomic travel does not need a turn-before-driving shim.
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      vy_max: 0.30
      # FINAL HEADING DURING THE APPROACH (2026-09-21). Before, the goal heading only counted within 0.20 m of the goal
      # and TwirlingCritic / PathAngleCritic / PreferForwardCritic fought any rotation until then, so the robot drove
      # to x,y and then turned on the spot - sweeping its square footprint's corners into a table next to the goal.
      # Now, within approach_distance (1.5 m) of the goal, the only heading objective is the goal heading: MPPI turns
      # while it strafes in, choosing where the costmap has room for the rotating footprint (CostCritic checks the
      # whole footprint along every sampled trajectory). Cost of this: in the last 1.5 m the robot may travel
      # sideways / backwards, i.e. partly into the lidar's blind sector (see the WARNING above).
      GoalAngleCritic:
        enabled: true
        cost_weight: 6.0
        threshold_to_consider: 1.5     # [m] approach_distance
      PathAngleCritic:
        threshold_to_consider: 1.5     # off inside approach_distance: it wants to face the direction of travel
      PreferForwardCritic:
        threshold_to_consider: 1.5     # off inside approach_distance: backing in is allowed there
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      TwirlingCritic:                  # holonomic only: damps needless rotation while translating
        enabled: true
        cost_power: 1                  # NOT "twirling_cost_power" (the stock yaml comment uses names the code ignores)
        cost_weight: 3.0               # was 10: it penalises ANY rotation while moving, i.e. the turn we now want

velocity_smoother:
  ros__parameters:
    # The y entries default to 0.0 and would zero every strafe command.
    max_velocity: [0.40, 0.30, 1.0]
    min_velocity: [-0.10, -0.30, -1.0]
    max_accel: [1.0, 1.0, 2.0]
    max_decel: [-1.5, -1.5, -3.0]
