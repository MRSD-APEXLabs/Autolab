/move_group:
  ros__parameters:
    default_robot_padding: 0.1
    default_robot_scale: 1.0
    allow_trajectory_execution: true
    capabilities: ''
    chomp:
      enable_failure_recovery: true
      jiggle_fraction: 0.05
      planning_plugin: chomp_interface/CHOMPPlanner
      request_adapters: default_planner_request_adapters/AddTimeOptimalParameterization
        default_planner_request_adapters/ResolveConstraintFrames default_planner_request_adapters/FixWorkspaceBounds
        default_planner_request_adapters/FixStartStateBounds default_planner_request_adapters/FixStartStateCollision
        default_planner_request_adapters/FixStartStatePathConstraints
      ridge_factor: 0.01
      start_state_max_bounds_error: 0.1
    default_planning_pipeline: ompl
    disable_capabilities: ''
    monitor_dynamics: false
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
    moveit_manage_controllers: true
    moveit_simple_controller_manager:
      controller_names:
      - demo_arm_bot_controller
      - demo_gripper_bot_controller
      demo_arm_bot_controller:
        joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        type: FollowJointTrajectory
      demo_gripper_bot_controller:
        joints:
        - Slider_1
        - Slider_2
        type: FollowJointTrajectory
