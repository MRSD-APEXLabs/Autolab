[develop]
script_dir=$base/lib/zedx_nano_camera
[install]
install_scripts=$base/lib/zedx_nano_camera
[build_scripts]
# run with the python3 first on PATH, so an activated virtualenv is used
executable=/usr/bin/env python3
[tool:pytest]
# colcon test runs pytest in the package folder; only collect test/ (the vendored RAFT code imports torch)
testpaths = test
