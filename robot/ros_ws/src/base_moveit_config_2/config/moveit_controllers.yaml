moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - demo_arm_bot_controller
    - demo_gripper_bot_controller

  demo_arm_bot_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory  # Isaac Sim / ros2_control standard
    default: True
    joints:
      - Revolute_9
      - Revolute_10
      - Revolute_11
      - Revolute_12
      - Revolute_13
      - Revolute_14

  demo_gripper_bot_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: True
    joints:
      - Slider_1
      - Slider_2