# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    demo_arm_bot_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    demo_gripper_bot_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    joints:
      - Revolute_9
      - Revolute_10
      - Revolute_11
      - Revolute_12
      - Revolute_13
      - Revolute_14
      - Slider_1
      - Slider_2
      - Revolute_1
      - Revolute_2
      - Revolute_3
      - Revolute_4
      - Revolute_5
      - Revolute_6
      - Revolute_7
      - Revolute_8

demo_arm_bot_controller:
  ros__parameters:
    joints:
      - Revolute_9
      - Revolute_10
      - Revolute_11
      - Revolute_12
      - Revolute_13
      - Revolute_14
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false  # default: true, set to false to prevent ROS2 Control from allowing non-zero end velocities in the trajectory (which can cause issues for MoveIt!)
demo_gripper_bot_controller:
  ros__parameters:
    joints:
      - Slider_1
      - Slider_2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false  

